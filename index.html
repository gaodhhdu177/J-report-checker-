<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · NiBi R-1.0</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">


<style>
:root {
  --bg: #f0f4f8;
  --card: #ffffff;
  --text: #0c1222;
  --muted: #5b6b7c;
  --line: #d8e0ea;
  --soft: #eef3f8;
  --primary: #0f766e;
  --ok: #059669;
  --bad: #e11d48;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(15,118,110,0.14), transparent),
    radial-gradient(ellipse 40% 30% at 100% 100%, rgba(245,158,11,0.08), transparent);
}
.box {
  width: 100%;
  max-width: 420px;
  background: var(--card);
  border-radius: 24px;
  padding: 40px 32px;
  box-shadow: 0 12px 48px rgba(12,18,34,0.1);
  border: 1px solid rgba(216,224,234,0.9);
}
.logo {
  width: 60px; height: 60px;
  border-radius: 18px;
  background: linear-gradient(135deg, #0f766e, #14b8a6);
  display: grid; place-items: center;
  font-weight: 800; font-size: 18px; color: #fff;
  margin: 0 auto 20px;
  box-shadow: 0 10px 28px rgba(15,118,110,0.4);
  letter-spacing: -0.5px;
}
h1 { text-align: center; font-size: 1.65rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px; }
.sub { text-align: center; font-size: 14px; color: var(--muted); margin-bottom: 12px; font-weight: 500; }
.version { text-align: center; font-size: 11px; color: #94a3b8; margin-bottom: 20px; font-weight: 600; letter-spacing: 0.5px; }
.label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
input {
  width: 100%;
  padding: 14px 16px;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  background: var(--soft);
  font-family: inherit;
  font-size: 15px;
  font-weight: 500;
  margin-bottom: 16px;
  transition: border 0.2s, box-shadow 0.2s, background 0.2s;
}
input:focus {
  outline: none;
  border-color: var(--primary);
  background: #fff;
  box-shadow: 0 0 0 4px rgba(15,118,110,0.14);
}
.btn {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  font-family: inherit;
  font-size: 15.5px;
  font-weight: 700;
  cursor: pointer;
  background: linear-gradient(135deg, #0f766e, #14b8a6);
  color: #fff;
  box-shadow: 0 8px 24px rgba(15,118,110,0.32);
  transition: opacity 0.2s, transform 0.15s;
}
.btn:active { transform: scale(0.98); }
.btn:hover { opacity: 0.95; }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }
.msg {
  display: none;
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: 12px;
  font-size: 13.5px;
  font-weight: 500;
}
.msg.show { display: block; }
.msg.err { background: #fff1f2; color: var(--bad); border: 1px solid #fecdd3; }
.msg.ok { background: #ecfdf5; color: var(--ok); border: 1px solid #a7f3d0; }
.foot { text-align: center; margin-top: 24px; font-size: 14px; color: var(--muted); }
.foot a { color: var(--primary); font-weight: 600; text-decoration: none; }
.credit { text-align: center; margin-top: 28px; font-size: 12px; color: #94a3b8; }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
window.NIBI_CONFIG = {
  SUPABASE_URL: 'YOUR_SUPABASE_URL',
  SUPABASE_ANON_KEY: 'sb_publishable_cc7mD2lJfFOfKEzN0jeZUw_n7gTzx0H'
};
window.NIBI_SEED = {
  admin: { email: 'nibir4550@gmail.com', password: 'Nibir5659@', name: 'Admin', role: 'admin', status: 'approved' },
  demo:  { email: 'a-tulsdemo@gmail.com', password: 'asdF1245', name: 'Demo User', role: 'user', status: 'approved' }
};
</script>

</head>
<body>
<div class="box">
  <div class="logo">NR</div>
  <h1>Welcome back</h1>
  <p class="sub">Sign in to access NiBi R-1.0</p>
  <p class="version">NiBi R-1.0</p>

  <label class="label">Email</label>
  <input type="email" id="email" placeholder="you@email.com" autocomplete="username">

  <label class="label">Password</label>
  <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">

  <button class="btn" id="loginBtn">Login</button>
  <div class="msg" id="msg"></div>

  <p class="foot">No account? <a href="register.html">Register</a></p>
  <p class="credit">developed by Gourab bro</p>
</div>

<script>
const cfg = window.NIBI_CONFIG || {};
const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

function showMsg(text, type) {
  var msg = document.getElementById('msg');
  msg.className = 'msg show ' + (type || 'err');
  msg.textContent = text;
}

async function seedAccounts() {
  if (!cfg.SUPABASE_URL || cfg.SUPABASE_URL.includes('YOUR_')) return;
  try {
    var seeds = [window.NIBI_SEED.admin, window.NIBI_SEED.demo];
    for (var i = 0; i < seeds.length; i++) {
      var u = seeds[i];
      var res = await sb.from('users').select('id').eq('email', u.email).maybeSingle();
      if (!res.data) {
        await sb.from('users').insert([{
          email: u.email,
          password: u.password,
          name: u.name,
          role: u.role,
          status: u.status
        }]);
      }
    }
  } catch (e) {}
}

(function(){
  try {
    var s = JSON.parse(localStorage.getItem('nibi_r1_session') || 'null');
    if (s && s.email) {
      if (s.role === 'admin') location.replace('admin.html');
      else if (s.status === 'approved') location.replace('dashboard.html');
    }
  } catch(e){}
})();

seedAccounts();

document.getElementById('loginBtn').onclick = async function() {
  var email = document.getElementById('email').value.trim().toLowerCase();
  var pass = document.getElementById('password').value;
  var btn = document.getElementById('loginBtn');

  if (!email || !pass) {
    showMsg('Please enter email and password.', 'err');
    return;
  }
  if (!cfg.SUPABASE_URL || cfg.SUPABASE_URL.includes('YOUR_')) {
    showMsg('config.js e SUPABASE_URL o KEY bosao.', 'err');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Logging in...';

  try {
    var res = await sb.from('users').select('*').eq('email', email).eq('password', pass).maybeSingle();
    var data = res.data;
    var error = res.error;

    if (error) throw error;
    if (!data) {
      showMsg('Invalid email or password.', 'err');
      btn.disabled = false;
      btn.textContent = 'Login';
      return;
    }
    if (data.role !== 'admin' && data.status !== 'approved') {
      showMsg('Your account is pending. Wait for admin approval.', 'err');
      btn.disabled = false;
      btn.textContent = 'Login';
      return;
    }

    localStorage.setItem('nibi_r1_session', JSON.stringify({
      id: data.id,
      email: data.email,
      name: data.name || data.email,
      role: data.role || 'user',
      status: data.status || 'approved'
    }));

    showMsg('Login successful! Redirecting...', 'ok');
    setTimeout(function(){
      if (data.role === 'admin') location.href = 'admin.html';
      else location.href = 'dashboard.html';
    }, 500);
  } catch (err) {
    showMsg(err.message || 'Login failed. Check config & table.', 'err');
    btn.disabled = false;
    btn.textContent = 'Login';
  }
};

document.getElementById('password').addEventListener('keydown', function(e){
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});
</script>
</body>
</html>
