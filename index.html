<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · NiBi R-1.0</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0f4f8;
  --card: #ffffff;
  --text: #0c1222;
  --muted: #5b6b7c;
  --line: #d8e0ea;
  --soft: #eef3f8;
  --primary: #0f766e;
  --primary-soft: #ecfdf5;
  --primary-dark: #0d5c56;
  --ok: #059669;
  --bad: #e11d48;
  --accent: #f59e0b;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(15,118,110,0.14), transparent),
    radial-gradient(ellipse 40% 30% at 100% 100%, rgba(245,158,11,0.08), transparent);
}
.box {
  width: 100%;
  max-width: 420px;
  background: var(--card);
  border-radius: 24px;
  padding: 40px 32px;
  box-shadow: 0 12px 48px rgba(12,18,34,0.1);
  border: 1px solid rgba(216,224,234,0.9);
}
.logo {
  width: 60px; height: 60px;
  border-radius: 18px;
  background: linear-gradient(135deg, #0f766e, #14b8a6);
  display: grid; place-items: center;
  font-weight: 800; font-size: 18px; color: #fff;
  margin: 0 auto 20px;
  box-shadow: 0 10px 28px rgba(15,118,110,0.4);
  letter-spacing: -0.5px;
}
h1 {
  text-align: center;
  font-size: 1.65rem;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin-bottom: 6px;
}
.sub {
  text-align: center;
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 28px;
  font-weight: 500;
}
.label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 8px;
}
input {
  width: 100%;
  padding: 14px 16px;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  background: var(--soft);
  font-family: inherit;
  font-size: 15px;
  font-weight: 500;
  margin-bottom: 16px;
  transition: border 0.2s, box-shadow 0.2s, background 0.2s;
}
input:focus {
  outline: none;
  border-color: var(--primary);
  background: #fff;
  box-shadow: 0 0 0 4px rgba(15,118,110,0.14);
}
.btn {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  font-family: inherit;
  font-size: 15.5px;
  font-weight: 700;
  cursor: pointer;
  background: linear-gradient(135deg, #0f766e, #14b8a6);
  color: #fff;
  box-shadow: 0 8px 24px rgba(15,118,110,0.32);
  transition: opacity 0.2s, transform 0.15s;
}
.btn:active { transform: scale(0.98); }
.btn:hover { opacity: 0.95; }
.msg {
  display: none;
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: 12px;
  font-size: 13.5px;
  font-weight: 500;
}
.msg.show { display: block; }
.msg.err { background: #fff1f2; color: var(--bad); border: 1px solid #fecdd3; }
.msg.ok { background: #ecfdf5; color: var(--ok); border: 1px solid #a7f3d0; }
.foot {
  text-align: center;
  margin-top: 24px;
  font-size: 14px;
  color: var(--muted);
}
.foot a {
  color: var(--primary);
  font-weight: 600;
  text-decoration: none;
}
.foot a:hover { text-decoration: underline; }
.credit {
  text-align: center;
  margin-top: 28px;
  font-size: 12px;
  color: #94a3b8;
}
.version {
  text-align: center;
  font-size: 11px;
  color: #94a3b8;
  margin-top: 6px;
  font-weight: 600;
  letter-spacing: 0.5px;
}
</style>
</head>
<body>
<div class="box">
  <div class="logo">NR</div>
  <h1>Welcome back</h1>
  <p class="sub">Sign in to access NiBi R-1.0</p>
  <p class="version">NiBi R-1.0</p>

  <label class="label">Email</label>
  <input type="email" id="email" placeholder="you@email.com" autocomplete="username">

  <label class="label">Password</label>
  <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">

  <button class="btn" id="loginBtn">Login</button>
  <div class="msg" id="msg"></div>

  <p class="foot">No account? <a href="register.html">Register</a></p>
  <p class="credit">developed by Gourab bro</p>
</div>

<script>
(function seedAccounts() {
  var users = [];
  try { users = JSON.parse(localStorage.getItem('nibi_r1_users') || '[]'); } catch(e) {}

  // Admin
  var adminEmail = 'nibir4550@gmail.com';
  var hasAdmin = users.some(function(u){ return (u.email || '').toLowerCase() === adminEmail; });
  if (!hasAdmin) {
    users.push({
      id: 'admin_1',
      email: adminEmail,
      password: 'Nibir5659@',
      name: 'Admin',
      role: 'admin',
      status: 'approved',
      createdAt: new Date().toISOString()
    });
  }

  // Default published demo user
  var demoEmail = 'a-tulsdemo@gmail.com';
  var hasDemo = users.some(function(u){ return (u.email || '').toLowerCase() === demoEmail; });
  if (!hasDemo) {
    users.push({
      id: 'demo_1',
      email: demoEmail,
      password: 'asdF1245',
      name: 'Demo User',
      role: 'user',
      status: 'approved',
      createdAt: new Date().toISOString()
    });
  }

  localStorage.setItem('nibi_r1_users', JSON.stringify(users));
})();

// Already logged in?
(function(){
  try {
    var s = JSON.parse(localStorage.getItem('nibi_r1_session') || 'null');
    if (s && s.email) {
      if (s.role === 'admin') location.replace('admin.html');
      else if (s.status === 'approved') location.replace('dashboard.html');
    }
  } catch(e){}
})();

document.getElementById('loginBtn').onclick = function() {
  var email = document.getElementById('email').value.trim().toLowerCase();
  var pass = document.getElementById('password').value;
  var msg = document.getElementById('msg');

  if (!email || !pass) {
    msg.className = 'msg show err';
    msg.textContent = 'Please enter email and password.';
    return;
  }

  var users = [];
  try { users = JSON.parse(localStorage.getItem('nibi_r1_users') || '[]'); } catch(e) {}

  var user = users.find(function(u){
    return (u.email || '').toLowerCase() === email && u.password === pass;
  });

  if (!user) {
    msg.className = 'msg show err';
    msg.textContent = 'Invalid email or password.';
    return;
  }

  if (user.role !== 'admin' && user.status !== 'approved') {
    msg.className = 'msg show err';
    msg.textContent = 'Your account is pending. Wait for admin approval.';
    return;
  }

  localStorage.setItem('nibi_r1_session', JSON.stringify({
    id: user.id,
    email: user.email,
    name: user.name || user.email,
    role: user.role || 'user',
    status: user.status || 'approved'
  }));

  msg.className = 'msg show ok';
  msg.textContent = 'Login successful! Redirecting...';

  setTimeout(function(){
    if (user.role === 'admin') location.href = 'admin.html';
    else location.href = 'dashboard.html';
  }, 600);
};

document.getElementById('password').addEventListener('keydown', function(e){
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});
</script>
</body>
</html>
