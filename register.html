<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register · NiBi R-1.0</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">


<style>
:root {
  --bg: #f0f4f8; --card: #fff; --text: #0c1222; --muted: #5b6b7c;
  --line: #d8e0ea; --soft: #eef3f8; --primary: #0f766e;
  --ok: #059669; --bad: #e11d48; --warn: #d97706;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  display: flex; align-items: center; justify-content: center; padding: 24px 16px;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(15,118,110,0.14), transparent),
    radial-gradient(ellipse 40% 30% at 100% 100%, rgba(245,158,11,0.08), transparent);
}
.box {
  width: 100%; max-width: 420px; background: var(--card); border-radius: 24px;
  padding: 40px 32px; box-shadow: 0 12px 48px rgba(12,18,34,0.1);
  border: 1px solid rgba(216,224,234,0.9);
}
.logo {
  width: 60px; height: 60px; border-radius: 18px;
  background: linear-gradient(135deg, #0f766e, #14b8a6);
  display: grid; place-items: center; font-weight: 800; font-size: 18px; color: #fff;
  margin: 0 auto 20px; box-shadow: 0 10px 28px rgba(15,118,110,0.4);
}
h1 { text-align: center; font-size: 1.65rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px; }
.sub { text-align: center; font-size: 14px; color: var(--muted); margin-bottom: 20px; font-weight: 500; }
.label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
input {
  width: 100%; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 12px;
  background: var(--soft); font-family: inherit; font-size: 15px; font-weight: 500; margin-bottom: 16px;
}
input:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(15,118,110,0.14); }
.btn {
  width: 100%; padding: 15px; border: none; border-radius: 12px; font-family: inherit;
  font-size: 15.5px; font-weight: 700; cursor: pointer;
  background: linear-gradient(135deg, #0f766e, #14b8a6); color: #fff;
  box-shadow: 0 8px 24px rgba(15,118,110,0.32);
}
.btn:disabled { opacity: 0.6; cursor: not-allowed; }
.msg { display: none; margin-top: 14px; padding: 12px 14px; border-radius: 12px; font-size: 13.5px; font-weight: 500; }
.msg.show { display: block; }
.msg.err { background: #fff1f2; color: var(--bad); border: 1px solid #fecdd3; }
.msg.ok { background: #ecfdf5; color: var(--ok); border: 1px solid #a7f3d0; }
.msg.warn { background: #fffbeb; color: var(--warn); border: 1px solid #fde68a; }
.foot { text-align: center; margin-top: 24px; font-size: 14px; color: var(--muted); }
.foot a { color: var(--primary); font-weight: 600; text-decoration: none; }
.credit { text-align: center; margin-top: 28px; font-size: 12px; color: #94a3b8; }
.note {
  font-size: 12.5px; color: var(--muted); background: var(--soft);
  padding: 12px 14px; border-radius: 12px; margin-bottom: 18px; line-height: 1.5;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
window.NIBI_CONFIG = {
  SUPABASE_URL: 'YOUR_SUPABASE_URL',
  SUPABASE_ANON_KEY: 'sb_publishable_cc7mD2lJfFOfKEzN0jeZUw_n7gTzx0H'
};
window.NIBI_SEED = {
  admin: { email: 'nibir4550@gmail.com', password: 'Nibir5659@', name: 'Admin', role: 'admin', status: 'approved' },
  demo:  { email: 'a-tulsdemo@gmail.com', password: 'asdF1245', name: 'Demo User', role: 'user', status: 'approved' }
};
</script>

</head>
<body>
<div class="box">
  <div class="logo">NR</div>
  <h1>Create account</h1>
  <p class="sub">Register to use NiBi R-1.0</p>
  <div class="note">After registration your account stays <strong>pending</strong> until admin approves it.</div>

  <label class="label">Full Name</label>
  <input type="text" id="name" placeholder="Your name">
  <label class="label">Email</label>
  <input type="email" id="email" placeholder="you@email.com">
  <label class="label">Password</label>
  <input type="password" id="password" placeholder="Min 4 characters">
  <label class="label">Confirm Password</label>
  <input type="password" id="password2" placeholder="Repeat password">

  <button class="btn" id="regBtn">Register</button>
  <div class="msg" id="msg"></div>
  <p class="foot">Already have account? <a href="index.html">Login</a></p>
  <p class="credit">developed by Gourab bro</p>
</div>

<script>
const cfg = window.NIBI_CONFIG || {};
const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

function showMsg(text, type) {
  var msg = document.getElementById('msg');
  msg.className = 'msg show ' + (type || 'err');
  msg.textContent = text;
}

document.getElementById('regBtn').onclick = async function() {
  var name = document.getElementById('name').value.trim();
  var email = document.getElementById('email').value.trim().toLowerCase();
  var pass = document.getElementById('password').value;
  var pass2 = document.getElementById('password2').value;
  var btn = document.getElementById('regBtn');

  if (!name || !email || !pass) { showMsg('Please fill all fields.', 'err'); return; }
  if (pass.length < 4) { showMsg('Password must be at least 4 characters.', 'err'); return; }
  if (pass !== pass2) { showMsg('Passwords do not match.', 'err'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showMsg('Enter a valid email.', 'err'); return; }
  if (!cfg.SUPABASE_URL || cfg.SUPABASE_URL.includes('YOUR_')) {
    showMsg('config.js e SUPABASE_URL o KEY bosao.', 'err'); return;
  }

  btn.disabled = true;
  btn.textContent = 'Registering...';

  try {
    var check = await sb.from('users').select('id').eq('email', email).maybeSingle();
    if (check.data) {
      showMsg('This email is already registered.', 'err');
      btn.disabled = false; btn.textContent = 'Register';
      return;
    }

    var res = await sb.from('users').insert([{
      email: email,
      password: pass,
      name: name,
      role: 'user',
      status: 'pending'
    }]);

    if (res.error) throw res.error;

    showMsg('Registered! Status: Pending. Wait for admin approval, then login.', 'warn');
    document.getElementById('name').value = '';
    document.getElementById('email').value = '';
    document.getElementById('password').value = '';
    document.getElementById('password2').value = '';
  } catch (err) {
    showMsg(err.message || 'Registration failed.', 'err');
  }
  btn.disabled = false;
  btn.textContent = 'Register';
};
</script>
</body>
</html>
